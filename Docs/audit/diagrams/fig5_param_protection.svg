<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480">
<rect width="1240" height="480" fill="white"/>
<rect x="30" y="30" width="300" height="80" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
<text x="180.0" y="52" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#1F4E79" text-anchor="middle">.compliance_params flash table</text>
<text x="180.0" y="72" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">registered values compiled into</text>
<text x="180.0" y="88" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">the firmware binary (PAR001)</text>
<path d="M 330 70 L 400 70" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="400,70 391,65 391,75" fill="#374151"/>
<text x="365.0" y="63.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="middle">covered by</text>
<rect x="400" y="30" width="220" height="80" rx="8" fill="#F2F4F7" stroke="#565F6B" stroke-width="1.5"/>
<text x="510.0" y="52" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#3B4148" text-anchor="middle">data_hash</text>
<text x="510.0" y="72" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">SHA-256 of exactly</text>
<text x="510.0" y="88" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">that flash section</text>
<path d="M 620 70 L 690 70" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="690,70 681,65 681,75" fill="#374151"/>
<text x="655.0" y="63.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="middle">registered in</text>
<rect x="690" y="30" width="240" height="80" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
<text x="810.0" y="52" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#1F4E79" text-anchor="middle">Signed manifest.bin</text>
<text x="810.0" y="72" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">cannot be altered without</text>
<text x="810.0" y="88" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">the private key</text>
<path d="M 930 70 L 1000 70" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="1000,70 991,65 991,75" fill="#374151"/>
<text x="965.0" y="63.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="middle">checked by</text>
<rect x="1000" y="30" width="210" height="80" rx="8" fill="#E4F1E4" stroke="#2E6B34" stroke-width="1.5"/>
<text x="1105.0" y="52" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#2E6B34" text-anchor="middle">POST, every boot</text>
<text x="1105.0" y="72" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">data_hash recomputed</text>
<text x="1105.0" y="88" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">from live flash</text>
<text x="30" y="148" font-family="Helvetica" font-size="11.5" font-style="italic" fill="#374151" text-anchor="start">Changing any registered value requires a new manufacturer-signed release — no ground-station or operator action can alter the certified table.</text>
<rect x="30" y="180" width="380" height="64" rx="8" fill="#FBF0D3" stroke="#9A6A0B" stroke-width="1.5"/>
<text x="220.0" y="204" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#7A5408" text-anchor="middle">param_set from Ground Control Station / operator</text>
<text x="220.0" y="224" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">every write to a compliance parameter is intercepted</text>
<path d="M 220 244 L 220 282" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="220,282 215,273 225,273" fill="#374151"/>
<rect x="30" y="282" width="560" height="116" rx="8" fill="#F2F4F7" stroke="#565F6B" stroke-width="1.5"/>
<text x="310.0" y="304" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#3B4148" text-anchor="middle">CAPPED — operator-tunable mission caps</text>
<text x="310.0" y="324" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">GF_MAX_VER_DIST 120 m · GF_MAX_HOR_DIST 500 m · MPC_XY_VEL_MAX 15 m/s</text>
<text x="310.0" y="340" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">within (0, ceiling]: accepted, RAM-only, never persisted</text>
<text x="310.0" y="356" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">above ceiling: REJECTED + audit-logged (ceiling quoted)</text>
<text x="310.0" y="372" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">boot value 0 → arming blocked until the operator sets each cap</text>
<rect x="630" y="282" width="560" height="116" rx="8" fill="#F2F4F7" stroke="#565F6B" stroke-width="1.5"/>
<text x="910.0" y="304" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#3B4148" text-anchor="middle">LOCKED — certificate-fixed configuration</text>
<text x="910.0" y="324" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">SYS_AUTOSTART 4001 · CA_AIRFRAME 0 · MAV_SIGN_CFG 1</text>
<text x="910.0" y="340" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">always reads the registered value (survives power-cycle)</text>
<text x="910.0" y="356" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">write of the registered value: accepted as a no-op</text>
<text x="910.0" y="372" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">any other value: REJECTED + audit-logged (attempted vs registered)</text>
<path d="M 410 214 L 910 214 L 910 274" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="910,282 905,273 915,273" fill="#374151"/>
<text x="660" y="208" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="middle">LOCKED rows</text>
<text x="240" y="262" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="start">CAPPED rows</text>
<text x="30" y="440" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">The protected property: the operator can fly more conservatively than the certificate allows, but can never move a</text>
<text x="30" y="457" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">certified value past its registered limit — and every attempt to do so is a signed audit event.</text>
</svg>