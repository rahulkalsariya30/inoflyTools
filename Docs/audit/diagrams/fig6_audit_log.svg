<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="360" viewBox="0 0 1240 360">
<rect width="1240" height="360" fill="white"/>
<rect x="30" y="30" width="310" height="110" rx="8" fill="#E4F1E4" stroke="#2E6B34" stroke-width="1.5"/>
<text x="185.0" y="52" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#2E6B34" text-anchor="middle">Flight Module writes audit events</text>
<text x="185.0" y="72" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">POST results (pass AND fail),</text>
<text x="185.0" y="88" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">update attempts, arming blocks,</text>
<text x="185.0" y="104" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">parameter violations — 316-byte</text>
<text x="185.0" y="120" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">CRC-protected entries → audit_log.bin</text>
<rect x="425" y="30" width="330" height="110" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
<text x="590.0" y="52" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#1F4E79" text-anchor="middle">Log hash bound to the root of trust</text>
<text x="590.0" y="72" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">SHA-256(audit_log.bin) encrypted</text>
<text x="590.0" y="88" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">with the EMBEDDED PUBLIC key</text>
<text x="590.0" y="104" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">→ audit_log.sig (256 bytes)</text>
<rect x="840" y="30" width="370" height="110" rx="8" fill="#F2F4F7" stroke="#565F6B" stroke-width="1.5"/>
<text x="1025.0" y="52" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#3B4148" text-anchor="middle">Offline verification (manufacturer / Certification Body)</text>
<text x="1025.0" y="72" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">decrypt .sig with the PRIVATE key,</text>
<text x="1025.0" y="88" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">recompute SHA-256, compare:</text>
<text x="1025.0" y="104" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">match → authentic and untampered</text>
<text x="1025.0" y="120" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">mismatch → edited or forged</text>
<path d="M 340 85 L 425 85" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="425,85 416,80 416,90" fill="#374151"/>
<text x="382.5" y="78.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="middle">every write</text>
<path d="M 755 85 L 840 85" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="840,85 831,80 831,90" fill="#374151"/>
<text x="797.5" y="78.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="middle">FTP / SD</text>
<text x="30" y="190" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">Why this proves origin and integrity: only the manufacturer's offline private key can open audit_log.sig. A log whose</text>
<text x="30" y="207" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">decrypted hash matches its content can only have been produced by a Flight Module carrying this root of trust, and</text>
<text x="30" y="224" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">cannot have been edited afterwards. The Flight Module itself holds no private key — a compromised drone cannot forge a valid log.</text>
<rect x="30" y="260" width="560" height="64" rx="8" fill="#FFFFFF" stroke="#565F6B" stroke-width="1.5"/>
<text x="310.0" y="284" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#3B4148" text-anchor="middle">Verification tools</text>
<text x="310.0" y="304" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">verify_audit_log.py (authenticity) · decode_audit_log.py (readable entries)</text>
</svg>