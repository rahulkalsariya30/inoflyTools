<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620">
<rect width="1240" height="620" fill="white"/>
<rect x="20" y="20" width="370" height="480" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="205.0" y="42" font-family="Helvetica" font-size="14" font-weight="bold" fill="#1F4E79" text-anchor="middle">MANUFACTURER  (offline)</text>
<rect x="440" y="20" width="300" height="480" rx="8" fill="#FBF0D3" stroke="#9A6A0B" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="590.0" y="42" font-family="Helvetica" font-size="14" font-weight="bold" fill="#7A5408" text-anchor="middle">GROUND  (operator)</text>
<rect x="790" y="20" width="430" height="480" rx="8" fill="#E4F1E4" stroke="#2E6B34" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="1005.0" y="42" font-family="Helvetica" font-size="14" font-weight="bold" fill="#2E6B34" text-anchor="middle">AIRCRAFT  (Flight Module)</text>
<rect x="45" y="60" width="320" height="78" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
<text x="205.0" y="82" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#1F4E79" text-anchor="middle">RSA-2048 private key</text>
<text x="205.0" y="102" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">held offline (air-gapped) — never leaves</text>
<text x="205.0" y="118" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">the manufacturer, never on the aircraft</text>
<rect x="45" y="158" width="320" height="96" rx="8" fill="#FFFFFF" stroke="#565F6B" stroke-width="1.5"/>
<text x="205.0" y="180" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#3B4148" text-anchor="middle">Release pipeline</text>
<text x="205.0" y="200" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">checksum (code + data separately)</text>
<text x="205.0" y="216" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">→ sign (RSA-PSS)  → bundle  → export</text>
<rect x="45" y="274" width="320" height="96" rx="8" fill="#F2F4F7" stroke="#565F6B" stroke-width="1.5"/>
<text x="205.0" y="296" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#3B4148" text-anchor="middle">Signed outputs</text>
<text x="205.0" y="316" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">manifest.bin (registered checksums)</text>
<text x="205.0" y="332" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">firmware .fwbundle</text>
<text x="205.0" y="348" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">signed bootloader artifact</text>
<rect x="45" y="400" width="320" height="78" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
<text x="205.0" y="422" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#1F4E79" text-anchor="middle">RSA-2048 public key</text>
<text x="205.0" y="442" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">PEM retained for the Certification Body;</text>
<text x="205.0" y="458" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">embedded in every Flight-Module binary</text>
<rect x="465" y="90" width="250" height="150" rx="8" fill="#FBF0D3" stroke="#9A6A0B" stroke-width="1.5"/>
<text x="590.0" y="112" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#7A5408" text-anchor="middle">inoflyGCU (QGroundControl fork)</text>
<text x="590.0" y="132" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">Secure Firmware Update UI</text>
<text x="590.0" y="148" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">Security status panel</text>
<text x="590.0" y="164" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">Audit Log panel</text>
<rect x="465" y="280" width="250" height="70" rx="8" fill="#FFFFFF" stroke="#565F6B" stroke-width="1.5"/>
<text x="590.0" y="302" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#3B4148" text-anchor="middle">MAVLink v2 signing</text>
<text x="590.0" y="322" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">HMAC-SHA256 on every message</text>
<rect x="815" y="66" width="380" height="64" rx="8" fill="#E4F1E4" stroke="#2E6B34" stroke-width="1.5"/>
<text x="1005.0" y="88" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#2E6B34" text-anchor="middle">Verifying bootloader  (sector 0)</text>
<text x="1005.0" y="108" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">embedded public key — verifies app signature</text>
<path d="M 1005 130 L 1005 156" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="1005,156 1000,147 1010,147" fill="#374151"/>
<rect x="815" y="156" width="380" height="158" rx="8" fill="#E4F1E4" stroke="#2E6B34" stroke-width="1.5"/>
<text x="1005.0" y="178" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#2E6B34" text-anchor="middle">App firmware — secure_boot module</text>
<text x="1005.0" y="198" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">POST: firmware integrity check on every boot</text>
<text x="1005.0" y="214" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">Update gatekeeper (signed updates only)</text>
<text x="1005.0" y="230" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">Compliance parameter guard</text>
<text x="1005.0" y="246" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">Audit logger (RSA-bound entries)</text>
<rect x="815" y="340" width="380" height="92" rx="8" fill="#F2F4F7" stroke="#565F6B" stroke-width="1.5"/>
<text x="1005.0" y="362" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#3B4148" text-anchor="middle">SD card</text>
<text x="1005.0" y="382" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">manifest.bin (signed registered checksums)</text>
<text x="1005.0" y="398" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">audit_log.bin + audit_log.sig</text>
<text x="1005.0" y="414" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">MAVLink signing key (provisioned)</text>
<path d="M 390 540 L 810 540" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="810,540 801,535 801,545" fill="#374151"/>
<text x="600.0" y="533.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="middle">signed .fwbundle → QGroundControl verifies → uploads over signed MAVLink + FTP</text>
<path d="M 810 575 L 390 575" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="390,575 399,570 399,580" fill="#374151"/>
<text x="600.0" y="568.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="middle">audit_log.bin + .sig downloaded for offline verification at the manufacturer / Certification Body</text>
<path d="M 390 612 L 810 612" stroke="#374151" stroke-width="1.5" fill="none" stroke-dasharray="5,4"/>
<polygon points="810,612 801,607 801,617" fill="#374151"/>
<text x="600.0" y="605.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="middle">public key embedded in bootloader + app firmware at build time (no key ever provisioned in the field)</text>
</svg>