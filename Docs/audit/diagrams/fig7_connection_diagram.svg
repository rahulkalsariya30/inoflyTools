<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660">
<rect width="1240" height="660" fill="white"/>
<rect x="40" y="90" width="340" height="160" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
<text x="210.0" y="112" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#1F4E79" text-anchor="middle">Provisioning host (Windows laptop)</text>
<text x="210.0" y="132" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">QGroundControl: firmware load,</text>
<text x="210.0" y="148" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">MAVLink console, MAVLink-FTP</text>
<text x="210.0" y="164" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">nsh serial console over USB</text>
<text x="210.0" y="180" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">signed release artifacts staged locally</text>
<rect x="700" y="60" width="500" height="330" rx="8" fill="#E4F1E4" stroke="#2E6B34" stroke-width="1.5"/>
<text x="950.0" y="82" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#2E6B34" text-anchor="middle">CubeOrange+ Flight Module (STM32H743, board-id 1063)</text>
<text x="950.0" y="102" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">sector 0 — secure verifying bootloader (manufacturer public key embedded)</text>
<text x="950.0" y="118" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">application firmware — POST re-verifies checksums on every boot</text>
<text x="950.0" y="134" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">ports below are on the carrier board</text>
<rect x="715" y="170" width="100" height="36" rx="8" fill="#FFFFFF" stroke="#565F6B" stroke-width="1.5"/>
<text x="765.0" y="193" font-family="Helvetica" font-size="12" font-weight="bold" fill="#3B4148" text-anchor="middle">USB port</text>
<rect x="715" y="320" width="110" height="36" rx="8" fill="#FFFFFF" stroke="#565F6B" stroke-width="1.5"/>
<text x="770.0" y="343" font-family="Helvetica" font-size="12" font-weight="bold" fill="#3B4148" text-anchor="middle">POWER1</text>
<rect x="1040" y="320" width="140" height="36" rx="8" fill="#FFFFFF" stroke="#565F6B" stroke-width="1.5"/>
<text x="1110.0" y="343" font-family="Helvetica" font-size="12" font-weight="bold" fill="#3B4148" text-anchor="middle">microSD slot</text>
<path d="M 380 188 L 715 188" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="715,188 706,183 706,193" fill="#374151"/>
<polygon points="380,188 389,183 389,193" fill="#374151"/>
<text x="547" y="176" font-family="Helvetica" font-size="11.5" font-weight="bold" font-style="italic" fill="#374151" text-anchor="middle">USB (data)</text>
<text x="547" y="208" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="middle">firmware load · nsh console · MAVLink-FTP</text>
<rect x="40" y="430" width="160" height="64" rx="8" fill="#F2F4F7" stroke="#565F6B" stroke-width="1.5"/>
<text x="120.0" y="456" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#3B4148" text-anchor="middle">LiPo battery</text>
<rect x="260" y="430" width="190" height="64" rx="8" fill="#F2F4F7" stroke="#565F6B" stroke-width="1.5"/>
<text x="355.0" y="456" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#3B4148" text-anchor="middle">Power module</text>
<path d="M 200 462 L 260 462" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="260,462 251,457 251,467" fill="#374151"/>
<path d="M 450 462 L 580 462 L 580 338 L 715 338" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="715,338 706,333 706,343" fill="#374151"/>
<text x="580" y="400.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="middle">power</text>
<text x="40" y="528" font-family="Helvetica" font-size="11.5" font-weight="bold" fill="#B42318" text-anchor="start">Battery power via POWER1 is mandatory — USB alone does not boot the Flight Module.</text>
<rect x="940" y="440" width="260" height="110" rx="8" fill="#F2F4F7" stroke="#565F6B" stroke-width="1.5"/>
<text x="1070.0" y="462" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#3B4148" text-anchor="middle">microSD card</text>
<text x="1070.0" y="482" font-family="Helvetica" font-size="10.5" fill="#333333" text-anchor="middle">inofly/manifest.bin (registered checksums)</text>
<text x="1070.0" y="497" font-family="Helvetica" font-size="10.5" fill="#333333" text-anchor="middle">signed bootloader .bin (one-shot install)</text>
<text x="1070.0" y="512" font-family="Helvetica" font-size="10.5" fill="#333333" text-anchor="middle">audit_log.bin + audit_log.sig</text>
<text x="1070.0" y="527" font-family="Helvetica" font-size="10.5" fill="#333333" text-anchor="middle">MAVLink signing key</text>
<path d="M 1110 440 L 1110 356" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="1110,356 1105,365 1115,365" fill="#374151"/>
<polygon points="1110,440 1105,431 1115,431" fill="#374151"/>
<text x="1095" y="412" font-family="Helvetica" font-size="10.5" font-style="italic" fill="#374151" text-anchor="end">seated in slot — files via</text>
<text x="1095" y="427" font-family="Helvetica" font-size="10.5" font-style="italic" fill="#374151" text-anchor="end">card reader or MAVLink-FTP</text>
<rect x="40" y="570" width="1160" height="64" rx="8" fill="#FBEAE8" stroke="#B42318" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="620.0" y="592" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#B42318" text-anchor="middle">Not used: ST-Link / SWD-JTAG debugger</text>
<text x="620.0" y="612" font-family="Helvetica" font-size="11" fill="#333333" text-anchor="middle">The debug pads sit inside the Cube enclosure behind the tamper-evident seal (BOOT007) — production flashing uses USB and the microSD card only; every flash path is gated by signature verification.</text>
</svg>