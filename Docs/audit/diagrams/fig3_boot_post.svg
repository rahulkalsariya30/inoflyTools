<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700">
<rect width="1240" height="700" fill="white"/>
<rect x="60" y="24" width="300" height="44" rx="8" fill="#F2F4F7" stroke="#565F6B" stroke-width="1.5"/>
<text x="210.0" y="52" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#3B4148" text-anchor="middle">Power on Flight Module</text>
<path d="M 210 68 L 210 96" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="210,96 205,87 215,87" fill="#374151"/>
<rect x="60" y="96" width="300" height="78" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
<text x="210.0" y="118" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#1F4E79" text-anchor="middle">Bootloader verifies app-firmware</text>
<text x="210.0" y="138" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">RSA-PSS signature against its</text>
<text x="210.0" y="154" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">embedded public key (BOOT001)</text>
<path d="M 360 135 L 470 135" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="470,135 461,130 461,140" fill="#374151"/>
<text x="415.0" y="128.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="middle">signature invalid</text>
<rect x="470" y="100" width="330" height="70" rx="8" fill="#FBEAE8" stroke="#B42318" stroke-width="1.5"/>
<text x="635.0" y="122" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#B42318" text-anchor="middle">Refuse to launch (fail-closed)</text>
<text x="635.0" y="142" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">stays in bootloader; unit only accepts</text>
<text x="635.0" y="158" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">a manufacturer-signed image</text>
<path d="M 210 174 L 210 202" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="210,202 205,193 215,193" fill="#374151"/>
<text x="220" y="192.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="start">signature valid</text>
<rect x="60" y="202" width="300" height="60" rx="8" fill="#E4F1E4" stroke="#2E6B34" stroke-width="1.5"/>
<text x="210.0" y="226" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#2E6B34" text-anchor="middle">App firmware boots;</text>
<text x="210.0" y="246" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">secure_boot module autostarts</text>
<path d="M 210 262 L 210 290" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="210,290 205,281 215,281" fill="#374151"/>
<rect x="60" y="290" width="620" height="240" rx="8" fill="#FFFFFF" stroke="#565F6B" stroke-width="1.5"/>
<text x="370.0" y="316" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#3B4148" text-anchor="middle">POST — checks run in this order, fail-closed at the first failure</text>
<circle cx="90" cy="344" r="11" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.2"/>
<text x="90" y="348" font-family="Helvetica" font-size="11.5" font-weight="bold" fill="#1F4E79" text-anchor="middle">1</text>
<text x="112" y="348" font-family="Helvetica" font-size="12" fill="#333333" text-anchor="start">Manifest present and readable on SD</text>
<text x="662" y="348" font-family="Helvetica" font-size="10.5" fill="#B42318" text-anchor="end">fail → reason 1 — NO_MANIFEST</text>
<circle cx="90" cy="375" r="11" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.2"/>
<text x="90" y="379" font-family="Helvetica" font-size="11.5" font-weight="bold" fill="#1F4E79" text-anchor="middle">2</text>
<text x="112" y="379" font-family="Helvetica" font-size="12" fill="#333333" text-anchor="start">Manifest CRC32 + format check</text>
<text x="662" y="379" font-family="Helvetica" font-size="10.5" fill="#B42318" text-anchor="end">fail → reason 2 — MANIFEST_CORRUPT</text>
<circle cx="90" cy="406" r="11" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.2"/>
<text x="90" y="410" font-family="Helvetica" font-size="11.5" font-weight="bold" fill="#1F4E79" text-anchor="middle">3</text>
<text x="112" y="410" font-family="Helvetica" font-size="12" fill="#333333" text-anchor="start">Manifest RSA-PSS signature (embedded public key)</text>
<text x="662" y="410" font-family="Helvetica" font-size="10.5" fill="#B42318" text-anchor="end">fail → reason 3 — SIGNATURE_INVALID</text>
<circle cx="90" cy="437" r="11" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.2"/>
<text x="90" y="441" font-family="Helvetica" font-size="11.5" font-weight="bold" fill="#1F4E79" text-anchor="middle">4</text>
<text x="112" y="441" font-family="Helvetica" font-size="12" fill="#333333" text-anchor="start">code_hash — recomputed from LIVE flash, compared</text>
<text x="662" y="441" font-family="Helvetica" font-size="10.5" fill="#B42318" text-anchor="end">fail → reason 4 — CODE_HASH_MISMATCH</text>
<circle cx="90" cy="468" r="11" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.2"/>
<text x="90" y="472" font-family="Helvetica" font-size="11.5" font-weight="bold" fill="#1F4E79" text-anchor="middle">5</text>
<text x="112" y="472" font-family="Helvetica" font-size="12" fill="#333333" text-anchor="start">data_hash — recomputed from LIVE flash, compared</text>
<text x="662" y="472" font-family="Helvetica" font-size="10.5" fill="#B42318" text-anchor="end">fail → reason 5 — DATA_HASH_MISMATCH</text>
<circle cx="90" cy="499" r="11" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.2"/>
<text x="90" y="503" font-family="Helvetica" font-size="11.5" font-weight="bold" fill="#1F4E79" text-anchor="middle">6</text>
<text x="112" y="503" font-family="Helvetica" font-size="12" fill="#333333" text-anchor="start">board_id matches this hardware</text>
<text x="662" y="503" font-family="Helvetica" font-size="10.5" fill="#B42318" text-anchor="end">fail → reason 6 — BOARD_ID_MISMATCH</text>
<path d="M 240 530 L 240 566" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="240,566 235,557 245,557" fill="#374151"/>
<text x="250" y="552.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="start">all pass</text>
<rect x="60" y="566" width="360" height="104" rx="8" fill="#E4F1E4" stroke="#2E6B34" stroke-width="1.5"/>
<text x="240.0" y="588" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#2E6B34" text-anchor="middle">PASS</text>
<text x="240.0" y="608" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">firmware_integrity_status = PASS</text>
<text x="240.0" y="624" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">POST_RESULT PASS written to audit log</text>
<text x="240.0" y="640" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">ARM gate allows arming</text>
<path d="M 560 530 L 560 566" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="560,566 555,557 565,557" fill="#374151"/>
<text x="570" y="552.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="start">any failure</text>
<rect x="460" y="566" width="360" height="104" rx="8" fill="#FBEAE8" stroke="#B42318" stroke-width="1.5"/>
<text x="640.0" y="588" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#B42318" text-anchor="middle">FAIL (fail-closed)</text>
<text x="640.0" y="608" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">firmware_integrity_status = FAIL + reason code</text>
<text x="640.0" y="624" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">POST_RESULT FAILURE written to audit log</text>
<text x="640.0" y="640" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">ARM gate blocks arming · ground station shows the reason</text>
<text x="860" y="320" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">Registered checksums live in the signed</text>
<text x="860" y="337" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">manifest.bin: they cannot be altered</text>
<text x="860" y="354" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">without the private key — any edit fails</text>
<text x="860" y="371" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">the CRC or the signature check.</text>
<text x="860" y="388" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start"></text>
<text x="860" y="405" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">Code and data are hashed separately</text>
<text x="860" y="422" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">(steps 4 and 5) so parameters can be</text>
<text x="860" y="439" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">revised by a future signed release</text>
<text x="860" y="456" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">without touching the code hash.</text>
<text x="860" y="473" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start"></text>
<text x="860" y="490" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">Both outcomes — PASS and FAIL — are</text>
<text x="860" y="507" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">recorded in the RSA-bound audit log.</text>
</svg>