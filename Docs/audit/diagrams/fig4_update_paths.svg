<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680">
<rect width="1240" height="680" fill="white"/>
<rect x="20" y="20" width="1200" height="230" rx="8" fill="#E4F1E4" stroke="#2E6B34" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="620.0" y="42" font-family="Helvetica" font-size="13" font-weight="bold" fill="#2E6B34" text-anchor="middle">PATH B — normal operator update: signed .fwbundle via QGroundControl</text>
<rect x="45" y="60" width="235" height="80" rx="8" fill="#FBF0D3" stroke="#9A6A0B" stroke-width="1.5"/>
<text x="162.5" y="82" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#7A5408" text-anchor="middle">QGroundControl verifies bundle</text>
<text x="162.5" y="102" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">signature client-side;</text>
<text x="162.5" y="118" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">“Install” enabled only if valid</text>
<rect x="360" y="60" width="235" height="80" rx="8" fill="#F2F4F7" stroke="#565F6B" stroke-width="1.5"/>
<text x="477.5" y="82" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#3B4148" text-anchor="middle">Flight Module stages</text>
<text x="477.5" y="102" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">update_manifest.bin</text>
<text x="477.5" y="118" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">(+ staged image, UPDATE.BIN)</text>
<rect x="675" y="60" width="270" height="80" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
<text x="810.0" y="82" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#1F4E79" text-anchor="middle">Flight Module verify_update gate</text>
<text x="810.0" y="102" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">CRC32 → RSA-PSS sig → board_id</text>
<text x="810.0" y="118" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">against EMBEDDED public key</text>
<rect x="1005" y="60" width="190" height="80" rx="8" fill="#E4F1E4" stroke="#2E6B34" stroke-width="1.5"/>
<text x="1100.0" y="82" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#2E6B34" text-anchor="middle">Next boot</text>
<text x="1100.0" y="102" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">bootloader BOOT001</text>
<text x="1100.0" y="118" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">+ full POST re-check</text>
<rect x="675" y="176" width="270" height="56" rx="8" fill="#FBEAE8" stroke="#B42318" stroke-width="1.5"/>
<text x="810.0" y="198" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#B42318" text-anchor="middle">Rejected — reason 2 / 3 / 4</text>
<text x="810.0" y="218" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">UPDATE_ATTEMPT FAILURE audit-logged</text>
<path d="M 280 100 L 360 100" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="360,100 351,95 351,105" fill="#374151"/>
<text x="320.0" y="93.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="middle">MAVLink-FTP</text>
<path d="M 595 100 L 675 100" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="675,100 666,95 666,105" fill="#374151"/>
<path d="M 945 100 L 1005 100" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="1005,100 996,95 996,105" fill="#374151"/>
<text x="975.0" y="93.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="middle">accept</text>
<path d="M 810 140 L 810 176" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="810,176 805,167 815,167" fill="#374151"/>
<text x="820" y="162.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="start">reject</text>
<text x="45" y="218" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="start">The Flight Module never trusts the Ground Control Station — it re-verifies everything against its own embedded key.</text>
<rect x="20" y="270" width="1200" height="150" rx="8" fill="#FBEAE8" stroke="#B42318" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="620.0" y="292" font-family="Helvetica" font-size="13" font-weight="bold" fill="#B42318" text-anchor="middle">PATH A — physical attack: raw image via USB/DFU</text>
<rect x="45" y="310" width="250" height="70" rx="8" fill="#FBEAE8" stroke="#B42318" stroke-width="1.5"/>
<text x="170.0" y="332" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#B42318" text-anchor="middle">Unsigned image written</text>
<text x="170.0" y="352" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">(requires breaking the</text>
<text x="170.0" y="368" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">tamper seal to reach USB)</text>
<rect x="375" y="310" width="300" height="70" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
<text x="525.0" y="332" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#1F4E79" text-anchor="middle">Bootloader refuses to launch</text>
<text x="525.0" y="352" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">signature check fails (BOOT001)</text>
<text x="525.0" y="368" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">— unit stays in bootloader</text>
<path d="M 295 345 L 375 345" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="375,345 366,340 366,350" fill="#374151"/>
<text x="335.0" y="338.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="middle">next boot</text>
<text x="710" y="330" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">Defense in depth: the tamper-evident seal (BOOT007) gates physical</text>
<text x="710" y="347" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">access, BOOT001 blocks execution of anything unsigned, and POST</text>
<text x="710" y="364" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="start">remains the checksum backstop.</text>
<rect x="20" y="440" width="1200" height="180" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="620.0" y="462" font-family="Helvetica" font-size="13" font-weight="bold" fill="#1F4E79" text-anchor="middle">BOOTLOADER UPDATE — signed bl_update (BOOT008)</text>
<rect x="45" y="480" width="280" height="76" rx="8" fill="#F2F4F7" stroke="#565F6B" stroke-width="1.5"/>
<text x="185.0" y="502" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#3B4148" text-anchor="middle">Candidate bootloader on SD</text>
<text x="185.0" y="522" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">must carry a manufacturer</text>
<text x="185.0" y="538" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">RSA-PSS signature</text>
<rect x="405" y="480" width="320" height="76" rx="8" fill="#DEEBF7" stroke="#1F4E79" stroke-width="1.5"/>
<text x="565.0" y="502" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#1F4E79" text-anchor="middle">bl_update verifies signature</text>
<text x="565.0" y="522" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">BEFORE erasing sector 0 —</text>
<text x="565.0" y="538" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">unsigned / tampered images refused</text>
<rect x="805" y="480" width="250" height="76" rx="8" fill="#E4F1E4" stroke="#2E6B34" stroke-width="1.5"/>
<text x="930.0" y="502" font-family="Helvetica" font-size="13.5" font-weight="bold" fill="#2E6B34" text-anchor="middle">Sector 0 rewritten</text>
<text x="930.0" y="522" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">new verifying bootloader</text>
<text x="930.0" y="538" font-family="Helvetica" font-size="11.5" fill="#333333" text-anchor="middle">installed (factory operation)</text>
<path d="M 325 518 L 405 518" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="405,518 396,513 396,523" fill="#374151"/>
<path d="M 725 518 L 805 518" stroke="#374151" stroke-width="1.5" fill="none"/>
<polygon points="805,518 796,513 796,523" fill="#374151"/>
<text x="765.0" y="511.0" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="middle">verified</text>
<text x="45" y="600" font-family="Helvetica" font-size="11" font-style="italic" fill="#374151" text-anchor="start">Every path is fail-closed: nothing unsigned is staged, launched, or written to sector 0.</text>
<text x="20" y="650" font-family="Helvetica" font-size="11.5" font-style="italic" fill="#374151" text-anchor="start">Three independent fail-closed layers protect every update: the ground-station client-side check, the Flight Module update gate, and boot-time verification (bootloader + POST).</text>
</svg>